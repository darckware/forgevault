server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any non-file route resolves to index.html so react-router client-side
    # routes (e.g. /secrets/:id) work on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Container-to-container proxy only — "api" resolves via the Docker compose network,
    # never a public hostname. The SPA calls same-origin /api/... and never needs to know
    # the API's real address.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

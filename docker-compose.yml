services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: forgevault
      POSTGRES_PASSWORD: forgevault_dev_only
      POSTGRES_DB: forgevault
    # host port 5435: this host already runs sibling-project Postgres instances on
    # 5432 (hindsight), 5433 (forgehub), 5434 (forgerouter), 5436 (darckware) — 5435 is
    # the next free slot. Only the host-side mapping matters; other services in this
    # compose file reach Postgres via the internal Docker network as "postgres:5432".
    ports:
      - "5435:5432"
    volumes:
      - forgevault_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgevault -d forgevault"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Bound to 127.0.0.1 only (never 0.0.0.0) — tightened alongside adding the `web` service
    # below: the API must not be reachable from outside localhost ("o consumo da api é pelo
    # localhost"). This repo's cloudflared tunnel had an existing public route to this port
    # from an earlier session; that's a separate misconfiguration that must be fixed in the
    # Cloudflare dashboard (out of scope here) — this binding at least stops every other path
    # (LAN, other containers publishing to the host) from exposing it.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ForgeVault: "Host=postgres;Port=5432;Database=forgevault;Username=forgevault;Password=forgevault_dev_only"
      ConnectionStrings__Redis: "redis:6379"
    volumes:
      # LocalFileKeyProvider fails fast without this (docs/modules/03_SECRETS_AND_ENCRYPTION.md)
      # — read-only mount of the same host-generated Master Key used by local `dotnet run`,
      # at the same default path (MasterKeyOptions.KeyFilePath) so no env override is needed.
      - /root/.forgevault:/root/.forgevault:ro

  web:
    build:
      context: src/ForgeVault.Web
      dockerfile: Dockerfile
    depends_on:
      - api
    # Bound to 127.0.0.1 only (never 0.0.0.0) — same "localhost only" requirement as `api`
    # above. Reachable off-host over the tailnet via the "forgevault" Tailscale Service
    # (`tailscale service list`), which proxies https://forgevault.<tailnet>.ts.net to this
    # 127.0.0.1:4200 — that replaced an earlier direct bind of this port to the host's
    # Tailscale IP (redundant once the Service existed) and, before that, a public Cloudflare
    # tunnel route to this port that was flagged as an unintended exposure of a secrets
    # manager (that tunnel route itself was removed outside this repo, in the Cloudflare
    # dashboard). The Tailscale Service config lives on the host/tailnet, not in this repo.
    # Port 4200 chosen because 3000 (darckware), 2100 (forgerouter), and 4173 (forgehub) are
    # already in use by sibling projects on this host.
    ports:
      - "127.0.0.1:4200:80"

volumes:
  forgevault_postgres_data:
